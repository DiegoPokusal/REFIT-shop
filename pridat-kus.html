<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pridať kus — REFIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --black: #0a0a0a; --white: #f0ece4; --red: #e63222; --gray: #1a1a1a; --mid: #2a2a2a; --text-muted: #666; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--black); color: var(--white); font-family: 'Space Mono', monospace; min-height: 100vh; -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.4rem; letter-spacing: 0.08em; margin: 0 0 4px; }
  h1 span { color: var(--red); }
  .sub { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.05em; margin-bottom: 28px; }
  .card { background: var(--gray); border: 1px solid var(--mid); padding: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  input[type="text"], input[type="password"] { width: 100%; background: var(--black); border: 1px solid var(--mid); color: var(--white); font-family: 'Space Mono', monospace; font-size: 16px; padding: 14px; margin-bottom: 14px; }
  input:focus { outline: none; border-color: var(--red); }
  button { width: 100%; background: var(--red); color: var(--white); border: none; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 0.15em; padding: 16px; cursor: pointer; }
  button:active { background: var(--white); color: var(--black); }
  button:disabled { opacity: 0.5; }
  .msg { font-size: 0.72rem; line-height: 1.6; padding: 12px 14px; margin-bottom: 16px; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: rgba(70,180,100,0.12); border-left: 2px solid #4ab464; color: #8fd4a8; }
  .msg.err { background: rgba(230,50,34,0.1); border-left: 2px solid var(--red); color: #f0a898; }
  .list-title { font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); margin: 32px 0 12px; }
  .pick { display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--mid); }
  .pick { align-items: center; padding: 8px 0; }
  .pick-url { font-size: 0.8rem; color: var(--white); flex: 1; line-height: 1.5; }
  .pick-url a { color: var(--white); text-decoration: none; }
  .pick-reason { font-size: 0.65rem; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
  .badge { font-size: 0.55rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; white-space: nowrap; flex-shrink: 0; }
  .badge.pending { background: var(--mid); color: var(--text-muted); }
  .badge.added { background: rgba(70,180,100,0.15); color: #4ab464; }
  .badge.rejected { background: rgba(230,50,34,0.15); color: var(--red); }
  .del-btn { background: none; border: 1px solid var(--mid); color: var(--text-muted); font-size: 0.6rem; padding: 6px 10px; cursor: pointer; flex-shrink: 0; }
  .bot-status { font-size: 0.68rem; line-height: 1.5; padding: 10px 14px; margin-bottom: 16px; border-left: 2px solid var(--mid); background: var(--gray); color: var(--text-muted); }
  .bot-status.ok { border-left-color: #4ab464; color: #8fd4a8; }
  .bot-status.bad { border-left-color: var(--red); color: #f0a898; }
  .shop-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--mid); }
  .shop-item img { width: 52px; height: 52px; object-fit: cover; background: var(--gray); flex-shrink: 0; }
  .shop-item-info { flex: 1; min-width: 0; }
  .shop-item-name { font-size: 0.68rem; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .shop-item-meta { font-size: 0.6rem; color: var(--text-muted); margin-top: 3px; letter-spacing: 0.05em; }
  .rm-btn { width: auto; background: none; border: 1px solid var(--red); color: var(--red); font-size: 0.95rem; padding: 8px 12px; flex-shrink: 0; }
  .rm-btn:active { background: var(--red); color: var(--white); }
  .rm-btn:disabled { border-color: var(--mid); color: var(--text-muted); font-size: 0.8rem; }
  .empty { font-size: 0.7rem; color: var(--text-muted); padding: 20px 0; text-align: center; }
  #gate { max-width: 340px; margin: 80px auto; padding: 0 20px; }
</style>
</head>
<body>

<div id="gate">
  <h1>RE<span>FIT</span></h1>
  <p class="sub">Ručný výber kusov</p>
  <div class="card">
    <label for="tokenInput">Heslo</label>
    <input type="password" id="tokenInput" autocomplete="off">
    <button onclick="unlock()">ODOMKNÚŤ</button>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <h1>RE<span>FIT</span></h1>
  <p class="sub">Vlož link na kus z thrifted.com, bot ho spracuje do 30 minút.</p>

  <div class="bot-status" id="botStatus">Bot: načítavam...</div>

  <div class="card">
    <label for="urlInput">Link na produkt</label>
    <input type="text" id="urlInput" placeholder="https://www.thrifted.com/products/...">
    <button id="addBtn" onclick="addPick()">PRIDAŤ</button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="list-title">Tvoje výbery</div>
  <div id="list"><div class="empty">Načítavam...</div></div>

  <div class="list-title">Aktuálne v obchode</div>
  <div id="shopList"><div class="empty">Načítavam...</div></div>
</div>

<script>
const SERVER = 'https://refit-shop-production.up.railway.app';
let token = localStorage.getItem('refit_admin_token') || '';

function unlock() {
  const t = document.getElementById('tokenInput').value.trim();
  if (!t) return;
  token = t;
  localStorage.setItem('refit_admin_token', t);
  showApp();
}

function showMsg(text, ok) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg show ' + (ok ? 'ok' : 'err');
}

function statusLabel(s) {
  return s === 'added' ? 'Pridané' : s === 'rejected' ? 'Zamietnuté' : 'Čaká';
}

async function loadList() {
  const listEl = document.getElementById('list');
  try {
    const res = await fetch(SERVER + '/api/manual-picks?token=' + encodeURIComponent(token));
    if (res.status === 401) { localStorage.removeItem('refit_admin_token'); location.reload(); return; }
    const data = await res.json();
    const all = data.manualPicks || [];
    pendingRemovals = new Set(all.filter(p => p.action === 'remove' && p.status === 'pending').map(p => String(p.productId)));
    const picks = all.map((p, i) => ({ ...p, n: i + 1 })).reverse();
    if (!picks.length) { listEl.innerHTML = '<div class="empty">Zatiaľ žiadne výbery.</div>'; }
    else listEl.innerHTML = picks.map(p => {
      const isRm = p.action === 'remove';
      const label = isRm ? (p.status === 'added' ? 'Odstránené' : p.status === 'rejected' ? 'Zamietnuté' : 'Čaká') : statusLabel(p.status);
      const num = p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">#${p.n}</a>` : `#${p.n}`;
      return `
      <div class="pick">
        <div class="pick-url">${num}${isRm ? ' <span class="pick-reason">odstrániť</span>' : ''}${p.reason ? `<div class="pick-reason">${esc(p.reason)}</div>` : ''}</div>
        <span class="badge ${p.status}">${label}</span>
        <button class="del-btn" onclick="removePick('${esc(p.id)}')">×</button>
      </div>`;
    }).join('');
    renderShop();
  } catch (e) {
    listEl.innerHTML = '<div class="empty">Nepodarilo sa načítať zoznam.</div>';
  }
}

// Cron fires every 30 min; anything past ~75 min without a heartbeat means
// the run didn't happen (or crashed before it could report).
const STALE_MS = 75 * 60 * 1000;

function ago(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  if (m < 1) return 'práve teraz';
  if (m < 60) return 'pred ' + m + ' min';
  const h = Math.floor(m / 60);
  if (h < 24) return 'pred ' + h + ' h ' + (m % 60) + ' min';
  return 'pred ' + Math.floor(h / 24) + ' d';
}

async function loadBotStatus() {
  const el = document.getElementById('botStatus');
  try {
    const res = await fetch(SERVER + '/api/bot-status?token=' + encodeURIComponent(token));
    const s = (await res.json()).botStatus;
    if (!s) { el.className = 'bot-status'; el.textContent = 'Bot: zatiaľ žiadny záznam o behu.'; return; }
    const stale = Date.now() - new Date(s.lastRunAt).getTime() > STALE_MS;
    if (stale) {
      el.className = 'bot-status bad';
      el.textContent = 'Bot nebeží: posledný beh ' + ago(s.lastRunAt) + '. Skontroluj Railway.';
    } else if (!s.ok) {
      el.className = 'bot-status bad';
      el.textContent = 'Posledný beh ' + ago(s.lastRunAt) + ' zlyhal: ' + (s.message || 'neznáma chyba');
    } else {
      el.className = 'bot-status ok';
      el.textContent = 'Posledný beh ' + ago(s.lastRunAt) + ': v poriadku' + (s.lastChangeAt ? ' · posledná zmena ' + ago(s.lastChangeAt) : '');
    }
  } catch (e) {
    el.className = 'bot-status bad';
    el.textContent = 'Nepodarilo sa načítať stav bota.';
  }
}

let shopProducts = [];
let pendingRemovals = new Set();

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function loadShop() {
  try {
    const res = await fetch('/stock.json?t=' + Date.now());
    const data = await res.json();
    shopProducts = (data.products || []).filter(p => (p.status || 'available') === 'available');
    renderShop();
  } catch (e) {
    document.getElementById('shopList').innerHTML = '<div class="empty">Nepodarilo sa načítať obchod.</div>';
  }
}

function renderShop() {
  const el = document.getElementById('shopList');
  if (!shopProducts.length) { el.innerHTML = '<div class="empty">V obchode nie sú žiadne kusy.</div>'; return; }
  const sorted = shopProducts.slice().sort((a, b) => (a.tier === b.tier ? 0 : a.tier === 'premium' ? -1 : 1));
  el.innerHTML = sorted.map(p => {
    const waiting = pendingRemovals.has(String(p.id));
    return `
    <div class="shop-item">
      <img src="${esc(p.image)}" alt="" loading="lazy">
      <div class="shop-item-info">
        <div class="shop-item-name">${esc(p.name)}</div>
        <div class="shop-item-meta">${p.tier === 'premium' ? 'PREMIUM' : 'DROPS'} · ${esc(p.price)}€</div>
      </div>
      <button class="rm-btn" ${waiting ? 'disabled' : ''} onclick="requestRemoval('${esc(p.id)}')">${waiting ? 'ČAKÁ' : '×'}</button>
    </div>`;
  }).join('');
}

async function requestRemoval(id) {
  const p = shopProducts.find(x => String(x.id) === String(id));
  if (!p) return;
  if (!confirm('Odstrániť z obchodu?\n\n' + p.name)) return;
  try {
    const res = await fetch(SERVER + '/api/manual-picks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, action: 'remove', productId: String(p.id), name: p.name, url: p.url }),
    });
    const data = await res.json();
    if (!res.ok) showMsg(data.error || 'Nepodarilo sa odstrániť.', false);
    else { showMsg('Odstránenie zaradené — bot ho vykoná do 30 minút.', true); loadList(); }
  } catch (e) {
    showMsg('Chyba pripojenia, skús znova.', false);
  }
}

async function addPick() {
  const input = document.getElementById('urlInput');
  const btn = document.getElementById('addBtn');
  const url = input.value.trim();
  if (!url) return;
  btn.disabled = true;
  btn.textContent = 'PRIDÁVAM...';
  try {
    const res = await fetch(SERVER + '/api/manual-picks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, url }),
    });
    const data = await res.json();
    if (!res.ok) { showMsg(data.error || 'Nepodarilo sa pridať.', false); }
    else { showMsg('Pridané do čakacieho zoznamu — bot to spracuje do 30 minút.', true); input.value = ''; loadList(); }
  } catch (e) {
    showMsg('Chyba pripojenia, skús znova.', false);
  }
  btn.disabled = false;
  btn.textContent = 'PRIDAŤ';
}

async function removePick(id) {
  try {
    await fetch(SERVER + '/api/manual-picks/' + id + '?token=' + encodeURIComponent(token), { method: 'DELETE' });
    loadList();
  } catch (e) {}
}

function showApp() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadShop();
  loadList();
  loadBotStatus();
  setInterval(loadBotStatus, 60000);
}

if (token) showApp();
</script>
</body>
</html>
